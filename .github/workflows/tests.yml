name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: python3 -m pytest tests/ -v --cov=src --cov-report=term-missing

      # Cliquet de couverture : 80,0 % mesure, barriere a 78 % pour absorber
      # les variations. La relever au fil des ajouts, jamais l'abaisser.
      - name: Coverage gate (fail if under 78%)
        run: coverage report --fail-under=78
