name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff mypy
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-cov
      - run: pytest tests/ --tb=short -q --co 2>&1 | tail -1
        name: Collect tests
      - run: pytest tests/ -x --tb=short -q --ignore=tests/test_benchmark_latence.py --ignore=tests/test_pipeline_integration.py --ignore=tests/test_inference_cycle.py --ignore=tests/test_collection_cycle.py
        name: Run unit tests
