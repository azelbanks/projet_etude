name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      # Version epinglee : ruff active de nouvelles regles a chaque release,
      # une version flottante fait echouer la CI sans changement de code.
      - run: pip install ruff==0.16.1 mypy==2.3.0
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      # Cliquet de typage : actif sur les 18 modules propres, voir [tool.mypy]
      # dans pyproject.toml pour la dette restante et la marche a suivre.
      - name: Type check
        run: mypy
      # Detecte tout artefact de modele altere, supprime ou ajoute sans suivi.
      - name: Verify model manifest
        run: python scripts/models_manifest.py verify

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-cov
      # pipefail obligatoire : sans lui le `| tail` masque l'echec de collecte.
      - name: Collect tests
        run: set -o pipefail && pytest tests/ --tb=short -q --co 2>&1 | tail -1
      # Suite complete : les exclusions historiques ont ete levees, les 5
      # fichiers concernes passent (46 tests, ~5 s) et couvrent l'integration.
      - name: Run unit tests
        run: pytest tests/ -x --tb=short -q
