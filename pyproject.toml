[tool.mutmut]
paths_to_mutate = "src/explainability/meta_decomposition.py"
tests_dir = "tests/"

[tool.pytest.ini_options]
pythonpath = ["src", "dashboard"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true      # stubs absents pour atproto, codecarbon, shap...
warn_unused_configs = true
warn_redundant_casts = true

# Cliquet de typage : la barriere est active sur les 18 modules deja propres,
# ce qui empeche toute regression. Les 15 modules ci-dessous portent 135 erreurs
# heritees (majoritairement le motif `self.model = None` puis usage direct dans
# les classes ML). Retirer un module de cette liste au fur et a mesure de
# l'assainissement — ne jamais en ajouter.
[[tool.mypy.overrides]]
module = [
    "src.api.main",
    "src.collection.collect_bluesky",
    "src.collection.data_quality_check",
    "src.collection.pipeline_monitor",
    "src.explainability.faithfulness",
    "src.explainability.integrated_gradients",
    "src.explainability.meta_decomposition",
    "src.explainability.shap_global",
    "src.monitoring.weekly_score_check",
    "src.pipeline.camembert_classifier",
    "src.pipeline.detector",
    "src.pipeline.emotion_classifier",
    "src.pipeline.mongo_aggregations",
    "src.pipeline.roberta_en_classifier",
    "src.scalability.kafka_consumer",
]
ignore_errors = true

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["notebooks", "models"]

[tool.ruff.lint]
# Jeu de regles explicite : sans cela ruff applique ses defauts, qui evoluent
# a chaque version et font echouer la CI sans qu'aucun code n'ait change.
select = [
    "E",    # pycodestyle
    "F",    # pyflakes (dont F821 undefined-name)
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # regles ruff
]
ignore = [
    "E501",     # longueur de ligne : gere par ruff format
    "B008",     # appel de fonction dans un argument par defaut (idiome FastAPI)
    "RUF001",   # caracteres unicode ambigus (texte francais accentue)
    "RUF002",
    "RUF003",
    "RUF012",   # ClassVar sur les attributs de classe mutables
]

[tool.ruff.lint.per-file-ignores]
# Motifs legitimes en test : sys.path.insert avant imports, tuples partiellement
# depaquetes, variables liees pour la lisibilite, with imbriques.
"tests/*" = ["E402", "RUF059", "F841", "B007", "SIM117"]
# Import place apres sys.path.insert : indispensable pour resoudre src/.
"src/monitoring/weekly_score_check.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "explainability", "monitoring", "dashboard"]
