[tool.mutmut]
paths_to_mutate = "src/explainability/meta_decomposition.py"
tests_dir = "tests/"

[tool.pytest.ini_options]
pythonpath = ["src", "dashboard"]

# Verification de types active sur la totalite de src/, sans exception.
# Aucun module n'est exclu : toute nouvelle erreur fait echouer la CI.
[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true      # stubs absents pour atproto, codecarbon, shap...
warn_unused_configs = true
warn_redundant_casts = true

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["notebooks", "models"]

[tool.ruff.lint]
# Jeu de regles explicite : sans cela ruff applique ses defauts, qui evoluent
# a chaque version et font echouer la CI sans qu'aucun code n'ait change.
select = [
    "E",    # pycodestyle
    "F",    # pyflakes (dont F821 undefined-name)
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # regles ruff
]
ignore = [
    "E501",     # longueur de ligne : gere par ruff format
    "B008",     # appel de fonction dans un argument par defaut (idiome FastAPI)
    "RUF001",   # caracteres unicode ambigus (texte francais accentue)
    "RUF002",
    "RUF003",
    "RUF012",   # ClassVar sur les attributs de classe mutables
]

[tool.ruff.lint.per-file-ignores]
# Motifs legitimes en test : sys.path.insert avant imports, tuples partiellement
# depaquetes, variables liees pour la lisibilite, with imbriques.
"tests/*" = ["E402", "RUF059", "F841", "B007", "SIM117"]
# Import place apres sys.path.insert : indispensable pour resoudre src/.
"src/monitoring/weekly_score_check.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "explainability", "monitoring", "dashboard"]
